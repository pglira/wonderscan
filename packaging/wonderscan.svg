<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>

  <!-- Page drop shadow -->
  <polygon points="164,160 366,130 386,382 154,370"
           fill="#000000" opacity="0.18"/>

  <!-- Page (photographed at an angle) -->
  <polygon points="158,150 360,120 380,372 148,360"
           fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Text lines, following the page perspective -->
  <g stroke="#9AA6B2" stroke-width="11" stroke-linecap="round">
    <line x1="176" y1="201" x2="344" y2="185"/>
    <line x1="175" y1="237" x2="347" y2="227"/>
    <line x1="174" y1="273" x2="350" y2="269"/>
    <line x1="173" y1="310" x2="285" y2="311"/>
  </g>

  <!-- Corner handles -->
  <g fill="#34D399" stroke="#FFFFFF" stroke-width="6">
    <circle cx="158" cy="150" r="22"/>
    <circle cx="360" cy="120" r="22"/>
    <circle cx="380" cy="372" r="22"/>
    <circle cx="148" cy="360" r="22"/>
  </g>
</svg>
